name: Check Links

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: >-
            --verbose --no-progress --timeout 60 --max-redirects 5
            --exclude "https://academy\\.langchain\\.com/.*"
            --exclude "https://chat\\.openai\\.com/.*"
            --exclude "https://claude\\.ai/.*"
            --exclude "https://creator\\.nightcafe\\.studio/.*"
            --exclude "https://gamma\\.app/.*"
            --exclude "https://ideogram\\.ai/.*"
            --exclude "https://leonardo\\.ai/.*"
            --exclude "https://magnific\\.ai/.*"
            --exclude "https://openai\\.com/.*"
            --exclude "https://pearai\\.com/.*"
            --exclude "https://platform\\.deepseek\\.com/.*"
            --exclude "https://play\\.ht/.*"
            --exclude "https://www\\.adept\\.ai/.*"
            --exclude "https://www\\.deeplearning\\.ai/.*"
            --exclude "https://www\\.midjourney\\.com/.*"
            --exclude "https://www\\.perplexity\\.ai/.*"
            --exclude "https://milvus\\.io/.*"
            "./**/*.md"
          fail: true
